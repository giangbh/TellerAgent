server.port=8799
server.address=127.0.0.1
spring.application.name=bsmart-teller-agent

# Optional local overrides (ignored by Git)
spring.config.import=optional:classpath:application-local.properties

# Logging
logging.level.com.dnse.teller=INFO
logging.level.org.springframework.web=INFO

# DeepSeek LLM Integration (OpenAI-compatible)
deepseek.api.enabled=${DEEPSEEK_ENABLED:false}
deepseek.api.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
deepseek.api.key=${DEEPSEEK_API_KEY:}
deepseek.api.model=${DEEPSEEK_MODEL:deepseek-chat}
deepseek.api.temperature=0.1
deepseek.api.timeout-seconds=25
